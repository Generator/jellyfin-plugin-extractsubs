changelog: |-
  - Fix converted SRT files keeping the original extension (e.g. SubRip data inside a .ass file)
  - Convert to SRT now writes an additional .srt next to the original format (.ass/.ssa/.vtt); new KeepOriginal option (default true)
  - Apply the .default marker only to the original format file, not to the converted .srt
  - Keep a .vtt extension for WebVTT streams instead of .srt
  - Add RemoveFontSize option (default true) to strip only size from <font> while keeping color/face
  - Pin Jellyfin.Controller/Data to 12.0.0 to fix NotSupported on server 12.0.0
  - Always add .default when IncludeDefaultMarker is enabled (even if IsDefault false) with 0./1. disambiguation for same-language duplicates
  - Skip .strm / IsPlaceHolder placeholders (27 docker/media trailers/YTS) to avoid ffprobe on external URLs
  - Handle numeric versions in plugin repo manifest generation (stringify versions before localeCompare)
  - Subtitles-only: remove attachment extraction stack (SelectedAttachmentsLibraries, ExtractAttachmentsTask, AttachmentExtractionProvider) – single library filter
  - Fix Jellyfin 12 file: prefix regression: ProbeAsync now tries MediaEncoder, falls back to direct ffprobe JSON parsing without file: prefix, then to item cached MediaStreams
  - Restore SubtitleExtractItemAddedEntryPoint hosted service for reliable ItemAdded/ItemUpdated trigger
  - Normalize ffmpeg muxer mapping: explicit -f for copyable codecs, pgssub/dvbsub/dvdsub -> matroska
  - Ensure ffprobe stdout/stderr are observed even on timeout
